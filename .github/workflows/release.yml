name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JavaScript
        run: |
          python -m py_compile scripts/build_extension.py
          for file in extension/src/*.js; do node --check "$file"; done
      - name: Read extension version
        id: version
        run: echo "version=$(python -c 'import json; print(json.load(open("extension/manifest.base.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Build browser archives
        run: python scripts/build_extension.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fuckcdz-browser-archives
          path: |
            dist/fuckcdz-chromium.zip
            dist/fuckcdz-gecko.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fuckcdz-browser-archives
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          name: "FuckCDZ v${{ needs.build.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          prerelease: false
          generate_release_notes: true
          files: |
            dist/fuckcdz-chromium.zip
            dist/fuckcdz-gecko.zip
