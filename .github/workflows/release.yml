name: Build and release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JavaScript
        run: |
          python -m py_compile scripts/build_extension.py
          for file in extension/src/*.js; do node --check "$file"; done
      - name: Build browser archives
        run: python scripts/build_extension.py
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fuckcdz-chromium.zip
            dist/fuckcdz-gecko.zip
