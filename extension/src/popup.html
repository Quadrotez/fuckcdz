<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МЭШ: задания и тесты</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="brand">МЭШ</span><h1>Задания и тесты</h1><p id="status">Определение активной вкладки…</p></header>
    <section class="actions">
      <button id="scan">Собрать задания дневника</button>
      <button id="exam">Показать все задания теста</button>

      <button id="debug">Открыть debug-лог</button>

    <p id="hint" class="hint"></p>

  <script src="popup.js"></script>

</html>
