<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FuckCDZ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="brand-row"><img class="brand-icon" src="icons/icon-48.png" alt=""><span class="brand">FuckCDZ</span></div><h1>Задания и тесты</h1><p id="status">Определение активной вкладки…</p></header><div class="popup-corner-controls"><button id="settings" class="icon-button" title="Настройки" aria-label="Открыть настройки">⚙</button><button data-theme-toggle class="icon-button popup-corner-theme" type="button" title="Сменить тему" aria-label="Сменить тему">☾</button></div>
    <section class="actions">
      <button id="scan">Собрать задания дневника</button>
      <button id="exam">Показать все задания теста</button>
      <button id="print">Печать / PDF</button>
      <button id="debug">Открыть debug-лог</button>
      <details class="maintenance"><summary>Обслуживание</summary><button id="clear" class="danger">Очистить локальные данные</button></details>
    </section>
    <p id="hint" class="hint"></p>
  </main>
  <script src="theme.js"></script><script src="popup.js"></script>
</body>
</html>
